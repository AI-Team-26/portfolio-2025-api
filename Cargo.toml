[package]
name = "portfolio_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
axum-prometheus = "0.10.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
# tokio + native-tls
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "postgres", "migrate", "chrono", "bigdecimal" ] }
# Add CORS support
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
rand = "0.10.3"
rand_core = "0.10"
hex = "0.4.3"
chrono = {version = "0.4.45", features = ["serde"]}
argon2 = "0.6.0"
password-hash = { version = "0.6", features = ["rand_core"] }
dashmap = "6.2.1"
base64 = "0.23.1"
rust_decimal = "1.43.0"
smol = "2.0.2"
reqwest = { version = "0.13.5", features = ["json"] }
tokio-cron-scheduler = "0.15.1"
serde_with = "3.24.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features=["json"] }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
http = "1"
tower = { version = "0.5", features = ["util"] }
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }
tokio-test = "0.4.5"

#[dev-dependencies]
#sqlx-cli = { version = "0.8.6", features = ["postgres"] }
